<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Support — Halo</title>
  <meta name="description" content="Get help with Halo products, orders, delivery and returns.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script>try{var t=localStorage.getItem('halo-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="support">
  <div id="site-header"></div>

  <main id="main">
    <div class="wrap">
      <section class="support-hero">
        <h1 class="display">Halo Support</h1>
        <p class="subhead">How can we help?</p>
        <label class="support-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="supportSearch" placeholder="Search support" aria-label="Search support" autocomplete="off">
        </label>
      </section>

      <nav class="topics" id="topics" aria-label="Support topics"></nav>
      <div id="faqs"></div>
      <p class="no-results" id="noResults" hidden></p>
    </div>

    <section class="section alt" id="contact" aria-labelledby="h-contact" style="margin-top:80px">
      <div class="wrap">
        <div class="section-head"><h2 class="headline" id="h-contact">Still need help? <span class="muted">We’re here.</span></h2></div>
        <div class="contact-grid" id="contactGrid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/art.js"></script>
  <script src="../assets/js/motion.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/support.js"></script>
</body>
</html>
